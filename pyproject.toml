[project]
name = "apiwatch"
version = "1.0.0"
description = "Open-source API monitoring dashboard built with Python and FastAPI. Track uptime, latency, incidents, and JSON response changes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["api-monitoring", "uptime", "fastapi", "observability", "sqlite"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "sqlalchemy>=2.0.30,<2.1",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "apscheduler>=3.11,<4.0",
    "jinja2>=3.1,<4.0",
]

[project.urls]
Homepage = "https://github.com/berkdogutan/ApiWatch"
Repository = "https://github.com/berkdogutan/ApiWatch"
Issues = "https://github.com/berkdogutan/ApiWatch/issues"
Changelog = "https://github.com/berkdogutan/ApiWatch/blob/main/CHANGELOG.md"

[project.scripts]
apiwatch = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Raised by starlette's TestClient itself; not actionable in this project.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]
